<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Emblem des Bundesamtes für Verfassungsschutz (fiktiv), animiert">
  <title>BfV-Emblem (fiktiv, Rollenspiel BDR)</title>
  <!-- Ablauf (2,4 s): Schild zeichnet sich, Adler fährt ein, Linien bauen sich auf, Lichtkante läuft über das Gold. Nur SMIL, keine Inline-Stile (CSP). -->
  <defs>
    <linearGradient id="glanz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="schild"><path d="M10 10H110V68C110 104 86 124 60 133C34 124 10 104 10 68Z"/></clipPath>
  </defs>
  <path d="M10 10H110V68C110 104 86 124 60 133C34 124 10 104 10 68Z" fill="#0e1013" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
  </path>
  <path d="M10 10H110V68C110 104 86 124 60 133C34 124 10 104 10 68Z" pathLength="1" fill="none" stroke="#e9c46a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/>
  </path>
  <path d="M17 17H103V68C103 99 83 116 60 125C37 116 17 99 17 68Z" fill="none" stroke="#e9c46a" stroke-opacity=".3" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
  </path>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-10 6" to="0 0" begin="0.6s" dur="0.8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/>
    <path d="M36 104L34 78L38 58L48 45L62 38L80 38L86 42L80 54L84 60L80 63L72 70L64 84L62 104L57 98L52 106L47 98L42 106Z" fill="#ededeb"/>
    <path d="M84 41L97 46L103 56L99 70L94 61L84 60L80 54Z" fill="#e9c46a"/>
    <path d="M63 46L84 43" stroke="#0e1013" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M69 49L79 47.5L74 53Z" fill="#0e1013">
      <animate attributeName="fill" values="#0e1013;#e5484d;#0e1013" begin="1.6s" dur="0.5s" fill="freeze"/>
    </path>
    <path d="M44 66L58 58M41 78L58 69M41 90L58 82" stroke="#0e1013" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".85"/>
  </g>
  <path d="M30 112H90" pathLength="1" stroke="#e5484d" stroke-width="3" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.1s" dur="0.5s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/>
  </path>
  <path d="M38 118H82" pathLength="1" stroke="#e9c46a" stroke-width="3" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.3s" dur="0.5s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/>
  </path>
  <g clip-path="url(#schild)">
    <rect x="-60" y="0" width="40" height="140" fill="url(#glanz)" transform="skewX(-18)" opacity=".5">
      <animate attributeName="x" from="-60" to="170" begin="1.7s" dur="0.9s" fill="freeze"/>
    </rect>
  </g>
</svg>
